server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 64k;

    # Docker embedded DNS
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    set $backend http://backend:8000;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control "no-store" always;

    # Shared reverse proxy configuration
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-API-Key $http_x_api_key;
    proxy_set_header Cookie "";

    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;

    proxy_cache off;

    # Block internal backend endpoints
    location = /api/v1/internal {
        return 403;
    }

    location ^~ /api/v1/internal/ {
        return 403;
    }

    # Health check
    location = /health {
        if ($request_method != GET) {
            return 405;
        }

        proxy_read_timeout 10s;
        proxy_pass $backend/health;
    }

    # Read-only dashboard API allowlist
    location ~ ^/api/v1/(coldchain/chambers|coldchain/escalations|telemetry|alerts)$ {
        if ($request_method != GET) {
            return 405;
        }

        proxy_pass $backend$uri$is_args$args;
    }

    # Alert acknowledgement
    location ~ ^/api/v1/alerts/[0-9]+/ack$ {
        if ($request_method != POST) {
            return 405;
        }

        proxy_pass $backend$uri$is_args$args;
    }

    # Cold-chain setpoint commands
    location ~ ^/api/v1/coldchain/cmd/(cc-01|cc-02|cc-03)$ {
        if ($request_method != POST) {
            return 405;
        }

        proxy_pass $backend$uri$is_args$args;
    }

    # Reject all other API paths
    location /api/ {
        return 404;
    }

    # Explicit static file allowlist
    location = / {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        try_files /index.html =404;
    }

    location ~ ^/(index[.]html|style[.]css|app[.]js)$ {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        try_files $uri =404;
    }

    # Reject all other paths
    location / {
        return 404;
    }
}
